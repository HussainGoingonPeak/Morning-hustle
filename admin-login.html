<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Hustle - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@0.395.0/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #374151; }
        .glass-panel { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 1.5rem; border: 1px solid rgba(209, 213, 219, 0.3); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen antialiased">
    <header class="sticky top-0 z-50 p-4">
        <nav class="container mx-auto max-w-6xl glass-panel p-4 flex justify-between items-center rounded-2xl">
            <a href="index.html" class="text-xl md:text-2xl font-bold text-gray-800 transition-opacity hover:opacity-80">Morning Hustle</a>
        </nav>
    </header>
    <main class="container mx-auto max-w-4xl p-4 sm:p-6 lg:p-8">
        <section class="min-h-[80vh] flex items-center justify-center">
            <div class="glass-panel p-8 md:p-12 rounded-3xl w-full max-w-md">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-900 text-center mb-4">Admin Access</h1>
                <p class="text-center text-gray-600 mb-8">Enter your credentials to access the dashboard.</p>
                <div class="text-center bg-blue-100/50 text-blue-800 text-sm p-3 rounded-lg mb-6">
                    <strong>Demo Credentials:</strong><br>
                    Username: <code>admin</code><br>
                    Password: <code>password</code>
                </div>
                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                        <input type="text" id="username" name="username" required class="w-full bg-gray-100/80 border-gray-300/90 rounded-lg p-3 focus:ring-2 focus:ring-gray-400 focus:border-transparent transition">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="password" name="password" required class="w-full bg-gray-100/80 border-gray-300/90 rounded-lg p-3 focus:ring-2 focus:ring-gray-400 focus:border-transparent transition">
                    </div>
                    <div id="error-message" class="text-red-500 text-sm font-medium text-center hidden">Invalid credentials. Please try again.</div>
                    <button type="submit" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg transition-transform duration-300 transform hover:scale-105 shadow-lg">Login</button>
                </form>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const loginForm = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const username = e.target.username.value;
                const password = e.target.password.value;
                if (username === 'admin' && password === 'password') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorMessage.classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
